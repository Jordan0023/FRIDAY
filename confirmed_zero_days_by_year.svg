<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Confirmed Router 0-Days by Year</title>
  <desc id="desc">Bar chart showing zero confirmed router 0-days in the local dataset for each year from 2021 through 2026.</desc>
  <rect width="1040" height="620" fill="#f7f8f4"/>

  <text x="64" y="58" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1f2933">Confirmed Router 0-Days by Year</text>
  <text x="64" y="88" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d">Confirmed-only view from the local firmware dataset. No confirmed 0-day records are present.</text>

  <line x1="104" y1="508" x2="960" y2="508" stroke="#9aa5b1" stroke-width="1"/>
  <line x1="104" y1="120" x2="104" y2="508" stroke="#9aa5b1" stroke-width="1"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606d">
    <line x1="98" y1="508" x2="960" y2="508" stroke="#d9e2ec" stroke-width="1"/>
    <text x="66" y="512">0</text>
    <line x1="98" y1="411" x2="960" y2="411" stroke="#d9e2ec" stroke-width="1"/>
    <text x="66" y="415">1</text>
    <line x1="98" y1="314" x2="960" y2="314" stroke="#d9e2ec" stroke-width="1"/>
    <text x="66" y="318">2</text>
    <line x1="98" y1="217" x2="960" y2="217" stroke="#d9e2ec" stroke-width="1"/>
    <text x="66" y="221">3</text>
    <line x1="98" y1="120" x2="960" y2="120" stroke="#d9e2ec" stroke-width="1"/>
    <text x="66" y="124">4</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="#334e68">
      <rect x="134" y="506" width="84" height="2"/>
      <rect x="272" y="506" width="84" height="2"/>
      <rect x="410" y="506" width="84" height="2"/>
      <rect x="548" y="506" width="84" height="2"/>
      <rect x="686" y="506" width="84" height="2"/>
      <rect x="824" y="506" width="84" height="2"/>
    </g>

    <g font-size="13" font-weight="700" fill="#1f2933">
      <text x="176" y="492" text-anchor="middle">0</text>
      <text x="314" y="492" text-anchor="middle">0</text>
      <text x="452" y="492" text-anchor="middle">0</text>
      <text x="590" y="492" text-anchor="middle">0</text>
      <text x="728" y="492" text-anchor="middle">0</text>
      <text x="866" y="492" text-anchor="middle">0</text>
    </g>

    <g font-size="14" fill="#1f2933">
      <text x="176" y="540" text-anchor="middle">2021</text>
      <text x="314" y="540" text-anchor="middle">2022</text>
      <text x="452" y="540" text-anchor="middle">2023</text>
      <text x="590" y="540" text-anchor="middle">2024</text>
      <text x="728" y="540" text-anchor="middle">2025</text>
      <text x="866" y="540" text-anchor="middle">2026</text>
    </g>
  </g>

  <rect x="280" y="160" width="480" height="96" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="520" y="197" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2933">No confirmed 0-days found in dataset</text>
  <text x="520" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d">Static audit findings were excluded from this confirmed-only chart.</text>

  <text x="64" y="594" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606d">Confirmed 0-day requires validation beyond heuristic strings, such as a verified advisory, exploit confirmation, or assigned vulnerability record.</text>
</svg>
