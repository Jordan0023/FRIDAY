<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Online-Confirmed Router/Network Edge 0-Days by Year</title>
  <desc id="desc">Bar chart of confirmed router and network edge firmware zero-days found from online sources, grouped by disclosure year.</desc>
  <rect width="1040" height="620" fill="#f7f8f4"/>

