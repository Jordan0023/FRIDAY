worker_processes 1;
pid /tmp/x3000-esim-nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 64;
}

http {
    access_log /dev/stdout;

    server {
        listen 8080;

        # Exact vulnerable location from firmware /etc/nginx/gl-conf.d/esim.conf.
        location /sdk/v1 {
            proxy_pass http://127.0.0.1:3456/sdk/v1;
        }
    }
}
