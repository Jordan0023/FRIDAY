<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="820" viewBox="0 0 1220 820" role="img" aria-labelledby="title desc">
  <title id="title">Router firmware and static findings by release year</title>
  <desc id="desc">Grouped bar chart comparing firmware releases and static heuristic findings from 2021 through 2026.</desc>
  <rect width="1220" height="820" fill="#09111f"/>

  <text x="28" y="74" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700">
    Router firmware and static findings by year
  </text>
  <text x="50" y="124" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">
    Total: 1,939 firmware images · 4,397 static findings
  </text>
  <g font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">
    <rect x="130" y="142" width="42" height="42" rx="8" fill="#38bdf8"/>
    <text x="190" y="178" fill="#dbeafe">Firmware releases</text>
    <rect x="130" y="194" width="42" height="42" rx="8" fill="#f59e0b"/>
    <text x="190" y="230" fill="#fef3c7">Static heuristic findings</text>
  </g>

  <!-- Plot area: x=110..1190, y=275..740; scale=0.186 px per count, max=2500 -->
  <g stroke="#26364d" stroke-width="1">
    <line x1="110" y1="740" x2="1190" y2="740"/>
    <line x1="110" y1="647" x2="1190" y2="647"/>
    <line x1="110" y1="554" x2="1190" y2="554"/>
    <line x1="110" y1="461" x2="1190" y2="461"/>
    <line x1="110" y1="368" x2="1190" y2="368"/>
    <line x1="110" y1="275" x2="1190" y2="275"/>
  </g>

  <g fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" text-anchor="end">
    <text x="98" y="746">0</text>
    <text x="98" y="653">500</text>
    <text x="98" y="560">1,000</text>
    <text x="98" y="467">1,500</text>
    <text x="98" y="374">2,000</text>
    <text x="98" y="281">2,500</text>
  </g>

  <!-- 2021: firmware 17, findings 9 -->
  <rect x="134" y="736.8" width="78" height="3.2" rx="5" fill="#38bdf8"/>
  <rect x="216" y="738.3" width="78" height="1.7" rx="5" fill="#f59e0b"/>
  <rect x="134" y="688.8" width="78" height="48" rx="8" fill="#38bdf8"/>
  <rect x="216" y="690.3" width="78" height="48" rx="8" fill="#f59e0b"/>
  <text x="173" y="725" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">17</text>
  <text x="255" y="727" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">9</text>

  <!-- 2022: firmware 50, findings 50 -->
  <rect x="314" y="730.7" width="78" height="9.3" rx="5" fill="#38bdf8"/>
  <rect x="396" y="730.7" width="78" height="9.3" rx="5" fill="#f59e0b"/>
  <rect x="314" y="682.7" width="78" height="48" rx="8" fill="#38bdf8"/>
  <rect x="396" y="682.7" width="78" height="48" rx="8" fill="#f59e0b"/>
  <text x="353" y="719" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">50</text>
  <text x="435" y="719" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">50</text>

