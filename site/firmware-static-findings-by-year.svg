<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="820" viewBox="0 0 1650 820" role="img" aria-labelledby="title desc">
  <title id="title">Router firmware and static findings by release year</title>
  <desc id="desc">Grouped bar chart comparing firmware releases and static heuristic findings from 2021 through 2026.</desc>
  <rect width="1650" height="820" fill="#09111f"/>

  <text x="28" y="74" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700">
    Router firmware and static findings by year
  </text>
  <text x="50" y="124" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">
    Total: 1,939 firmware images · 4,397 static findings
  </text>
  <g font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">
    <rect x="1080" y="142" width="42" height="42" rx="8" fill="#38bdf8"/>
    <text x="1140" y="178" fill="#dbeafe">Firmware releases</text>
    <rect x="1080" y="194" width="42" height="42" rx="8" fill="#f59e0b"/>
    <text x="1140" y="230" fill="#fef3c7">Static heuristic findings</text>
  </g>

  <!-- Plot area: x=110..1635, y=275..740; scale=0.186 px per count, max=2500 -->
  <g stroke="#26364d" stroke-width="1">
    <line x1="110" y1="740" x2="1635" y2="740"/>
    <line x1="110" y1="647" x2="1635" y2="647"/>
    <line x1="110" y1="554" x2="1635" y2="554"/>
    <line x1="110" y1="461" x2="1635" y2="461"/>
    <line x1="110" y1="368" x2="1635" y2="368"/>
    <line x1="110" y1="275" x2="1635" y2="275"/>
  </g>

  <g fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" text-anchor="end">
    <text x="98" y="746">0</text>
    <text x="98" y="653">500</text>
    <text x="98" y="560">1,000</text>
    <text x="98" y="467">1,500</text>
    <text x="98" y="374">2,000</text>
    <text x="98" y="281">2,500</text>
  </g>

  <!-- 2021: firmware 17, findings 9 -->
  <rect x="105" y="688.8" width="110" height="51.2" rx="8" fill="#38bdf8"/>
  <rect x="225" y="690.3" width="110" height="49.7" rx="8" fill="#f59e0b"/>
  <text x="160" y="725" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">17</text>
  <text x="280" y="727" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">9</text>

  <!-- 2022: firmware 50, findings 50 -->
  <rect x="365" y="682.7" width="110" height="57.3" rx="8" fill="#38bdf8"/>
  <rect x="485" y="682.7" width="110" height="57.3" rx="8" fill="#f59e0b"/>
  <text x="420" y="719" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">50</text>
  <text x="540" y="719" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">50</text>

  <!-- 2023: firmware 111, findings 178 -->
  <rect x="625" y="671.4" width="110" height="68.6" rx="8" fill="#38bdf8"/>
  <rect x="745" y="658.9" width="110" height="81.1" rx="8" fill="#f59e0b"/>
  <text x="680" y="707" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">111</text>
  <text x="800" y="695" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">178</text>

  <!-- 2024: firmware 225, findings 392 -->
  <rect x="885" y="650.2" width="110" height="89.8" rx="8" fill="#38bdf8"/>
  <rect x="1005" y="667.1" width="110" height="72.9" rx="8" fill="#f59e0b"/>
  <text x="940" y="686" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">225</text>
  <text x="1060" y="714" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">392</text>

  <!-- 2025: firmware 352, findings 782 -->
  <rect x="1145" y="674.5" width="110" height="65.5" rx="8" fill="#38bdf8"/>
  <rect x="1265" y="594.5" width="110" height="145.5" rx="8" fill="#f59e0b"/>
  <text x="1200" y="721" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">352</text>
  <text x="1320" y="642" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">782</text>

  <!-- 2026: firmware 890, findings 2313 -->
  <rect x="1405" y="574.5" width="110" height="165.5" rx="8" fill="#38bdf8"/>
  <rect x="1525" y="309.8" width="110" height="430.2" rx="8" fill="#f59e0b"/>
  <text x="1460" y="622" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">890</text>
  <text x="1580" y="358" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" text-anchor="middle">2,313</text>

  <g fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" text-anchor="middle">
    <text x="220" y="793">2021</text>
    <text x="480" y="793">2022</text>
    <text x="740" y="793">2023</text>
    <text x="1000" y="793">2024</text>
    <text x="1260" y="793">2025</text>
    <text x="1520" y="793">2026</text>
  </g>

</svg>
