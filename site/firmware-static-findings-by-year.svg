  <rect x="670" y="650.2" width="86" height="48" rx="8" fill="#38bdf8"/>
  <text x="713" y="686" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">225</text>
  <text x="795" y="714" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">392</text>

  <!-- 2025: firmware 352, findings 782 -->
  <rect x="854" y="674.5" width="78" height="65.5" rx="5" fill="#38bdf8"/>
  <rect x="936" y="594.5" width="78" height="145.5" rx="5" fill="#f59e0b"/>
  <text x="893" y="721" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">352</text>
  <text x="975" y="642" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">782</text>

