<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="820" viewBox="-15 0 1490 820" role="img" aria-labelledby="title desc">
  <title id="title">Router firmware and static findings by release year</title>
  <desc id="desc">Grouped bar chart comparing firmware releases and static heuristic findings from 2021 through 2026.</desc>
  <rect x="-15" width="1490" height="820" fill="#09111f"/>

  <text x="28" y="78" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="700">
    Router firmware and static findings by year
  </text>
  <text x="50" y="132" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700">
    Total: 1,939 firmware images · 4,397 static findings
  </text>
  <g font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">
    <rect x="900" y="142" width="42" height="42" rx="8" fill="#38bdf8"/>
    <text x="960" y="178" fill="#dbeafe">Firmware releases</text>
    <rect x="900" y="194" width="42" height="42" rx="8" fill="#f59e0b"/>
    <text x="960" y="230" fill="#fef3c7">Static heuristic findings</text>
  </g>

  <!-- Plot area: x=110..1462, y=275..740; scale=0.186 px per count, max=2500 -->
  <g stroke="#26364d" stroke-width="1">
    <line x1="110" y1="740" x2="1462" y2="740"/>
    <line x1="110" y1="647" x2="1462" y2="647"/>
    <line x1="110" y1="554" x2="1462" y2="554"/>
    <line x1="110" y1="461" x2="1462" y2="461"/>
    <line x1="110" y1="368" x2="1462" y2="368"/>
    <line x1="110" y1="275" x2="1462" y2="275"/>
  </g>

  <g fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="end">
    <text x="98" y="746">0</text>
    <text x="98" y="653">500</text>
    <text x="98" y="560">1,000</text>
    <text x="98" y="467">1,500</text>
    <text x="98" y="374">2,000</text>
    <text x="98" y="281">2,500</text>
  </g>

  <!-- 2021: firmware 17, findings 9 -->
  <rect x="114" y="688.8" width="110" height="51.2" rx="8" fill="#38bdf8"/>
  <rect x="226" y="690.3" width="110" height="49.7" rx="8" fill="#f59e0b"/>
  <text x="169" y="725" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="middle">17</text>
  <text x="281" y="727" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="middle">9</text>

  <!-- 2022: firmware 50, findings 50 -->
  <rect x="339" y="682.7" width="110" height="57.3" rx="8" fill="#38bdf8"/>
  <rect x="451" y="682.7" width="110" height="57.3" rx="8" fill="#f59e0b"/>
  <text x="394" y="719" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="middle">50</text>
  <text x="506" y="719" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="middle">50</text>

  <!-- 2023: firmware 111, findings 178 -->
  <rect x="564" y="671.4" width="110" height="68.6" rx="8" fill="#38bdf8"/>
  <rect x="676" y="658.9" width="110" height="81.1" rx="8" fill="#f59e0b"/>
  <text x="619" y="707" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="middle">111</text>
  <text x="731" y="695" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="middle">178</text>

  <!-- 2024: firmware 225, findings 392 -->
  <rect x="789" y="650.2" width="110" height="89.8" rx="8" fill="#38bdf8"/>
  <rect x="901" y="667.1" width="110" height="72.9" rx="8" fill="#f59e0b"/>
  <text x="844" y="686" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="middle">225</text>
  <text x="956" y="714" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="middle">392</text>

  <!-- 2025: firmware 352, findings 782 -->
  <rect x="1014" y="674.5" width="110" height="65.5" rx="8" fill="#38bdf8"/>
  <rect x="1126" y="594.5" width="110" height="145.5" rx="8" fill="#f59e0b"/>
  <text x="1069" y="721" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="middle">352</text>
  <text x="1181" y="642" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="middle">782</text>

  <!-- 2026: firmware 890, findings 2313 -->
  <rect x="1239" y="574.5" width="110" height="165.5" rx="8" fill="#38bdf8"/>
  <rect x="1351" y="309.8" width="110" height="430.2" rx="8" fill="#f59e0b"/>
  <text x="1294" y="622" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" text-anchor="middle">890</text>
  <text x="1406" y="358" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">2,313</text>

  <g fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="800" text-anchor="middle">
    <text x="225" y="797">2021</text>
    <text x="450" y="797">2022</text>
    <text x="675" y="797">2023</text>
    <text x="900" y="797">2024</text>
    <text x="1125" y="797">2025</text>
    <text x="1350" y="797">2026</text>
  </g>

</svg>
