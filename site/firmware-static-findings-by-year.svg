  <rect x="1034" y="574.5" width="78" height="165.5" rx="5" fill="#38bdf8"/>
  <rect x="1116" y="309.8" width="78" height="430.2" rx="5" fill="#f59e0b"/>
  <text x="1073" y="622" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">890</text>
  <text x="1155" y="358" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">2,313</text>

  <g fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" text-anchor="middle">
    <text x="214" y="793">2021</text>
    <text x="394" y="793">2022</text>
    <text x="574" y="793">2023</text>
    <text x="754" y="793">2024</text>
