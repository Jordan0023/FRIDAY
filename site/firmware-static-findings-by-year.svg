  <rect x="494" y="719.4" width="78" height="20.6" rx="5" fill="#38bdf8"/>
  <rect x="576" y="706.9" width="78" height="33.1" rx="5" fill="#f59e0b"/>
  <rect x="490" y="671.4" width="86" height="48" rx="8" fill="#38bdf8"/>
  <rect x="572" y="658.9" width="86" height="48" rx="8" fill="#f59e0b"/>
  <text x="533" y="707" fill="#082f49" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">111</text>
  <text x="615" y="695" fill="#451a03" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">178</text>

