    <rect x="725" y="43" width="14" height="14" fill="#0f766e"/>
    <text x="747" y="55">GL.iNet</text>
    <rect x="815" y="43" width="14" height="14" fill="#c2410c"/>
    <text x="837" y="55">Netgear</text>
    <rect x="910" y="43" width="14" height="14" fill="#7c3aed"/>
    <text x="932" y="55">OpenWrt</text>
    <rect x="650" y="69" width="14" height="14" fill="#ca8a04"/>
    <text x="672" y="81">TP-Link</text>
