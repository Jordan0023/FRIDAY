<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Router Firmware Uploads by Year and Brand</title>
  <desc id="desc">Stacked bar chart showing firmware upload counts by year, split by ASUS, GL.iNet, Netgear, OpenWrt, and TP-Link.</desc>
  <rect width="1040" height="620" fill="#f7f8f4"/>

  <text x="64" y="58" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1f2933">Router Firmware Uploads by Year and Brand</text>
  <text x="64" y="88" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52606d">Grouped by uploaded_at year from site/data/firmware-dashboard.json</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2933">
    <rect x="650" y="43" width="14" height="14" fill="#2563eb"/>
